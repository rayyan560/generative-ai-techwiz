services:
  - type: web
    name: supportnova
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URI
        sync: false
      - key: GOOGLE_GENAI_API_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
