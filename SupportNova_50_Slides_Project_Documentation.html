    ];

    additionalSlides.forEach((s, idx) => {
      const slideNum = idx + 21;
      slidesData.push({
        section: s.section,
        tag: `Slide ${slideNum < 10 ? '0' + slideNum : slideNum} • ${s.section}`,
        title: s.title,
        desc: s.desc,
        grid: "2",
        items: [
          { icon: s.icon1, title: "Operational Mechanism", desc: `Engineered for high reliability with deterministic ground-truth verification and automated metrics logging.` },
          { icon: s.icon2, title: "Project Scope", desc: `Use the implemented workflow as decision support; staff review and environment-specific verification remain necessary.` }
        ]
      });
    });

    let currentSlide = 0;
    const stage = document.getElementById("slideStage");
    const overviewGrid = document.getElementById("overviewGrid");

    function renderDeck() {
      stage.innerHTML = "";
      overviewGrid.innerHTML = "";

      slidesData.forEach((s, idx) => {
        // Slide element
        const slideEl = document.createElement("div");
        slideEl.className = `slide-wrapper ${idx === 0 ? 'active' : ''}`;
        slideEl.id = `slide-${idx}`;

        let gridClass = "slide-grid-2";
        if (s.grid === "3") gridClass = "slide-grid-3";
        if (s.grid === "4") gridClass = "slide-grid-4";

        const itemsHtml = s.items.map(item => `
          <div class="feature-box">
            <div class="feature-box-icon"><i class="fa-solid ${item.icon}"></i></div>
            <div class="feature-box-title">${item.title}</div>
            <div class="feature-box-desc">${item.desc}</div>
          </div>
        `).join("");

        slideEl.innerHTML = `
          <div class="slide-card">
            <div class="slide-tag"><i class="fa-solid fa-sparkles"></i> ${s.tag}</div>
            <h1 class="slide-heading">${s.title}</h1>
            <p class="slide-desc">${s.desc}</p>
            <div class="${gridClass}">
              ${itemsHtml}
            </div>
          </div>
        `;
        stage.appendChild(slideEl);

        // Overview Grid Item
        const overEl = document.createElement("div");
        overEl.className = `overview-item ${idx === 0 ? 'active' : ''}`;
        overEl.id = `over-${idx}`;
        overEl.onclick = () => goToSlide(idx);
        overEl.innerHTML = `
          <div style="font-size:0.75rem; color:#818cf8; font-weight:700;">#${idx+1}</div>
          <div style="font-size:0.85rem; font-weight:700; color:#fff; margin-top:2px;">${s.title.substring(0, 42)}...</div>
        `;
        overviewGrid.appendChild(overEl);
      });
      updateUI();
    }

    function updateUI() {
      document.querySelectorAll(".slide-wrapper").forEach((el, i) => {
        el.classList.toggle("active", i === currentSlide);
      });
      document.querySelectorAll(".overview-item").forEach((el, i) => {
        el.classList.toggle("active", i === currentSlide);
      });

      document.getElementById("slideCounter").innerText = `Slide ${currentSlide + 1} / ${slidesData.length}`;
      document.getElementById("deckSectionTitle").innerText = slidesData[currentSlide].section;
      const pct = ((currentSlide + 1) / slidesData.length) * 100;
      document.getElementById("progressFill").style.width = `${pct}%`;
    }

    function nextSlide() {
      if (currentSlide < slidesData.length - 1) {
        currentSlide++;
        updateUI();
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        updateUI();
      }
    }

    function goToSlide(idx) {
      currentSlide = idx;
      updateUI();
      toggleOverview();
    }

    function toggleOverview() {
      const m = document.getElementById("overviewModal");
      m.style.display = m.style.display === "flex" ? "none" : "flex";
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") nextSlide();
      else if (e.key === "ArrowLeft" || e.key === "PageUp") prevSlide();
      else if (e.key.toLowerCase() === "o") toggleOverview();
      else if (e.key.toLowerCase() === "f") toggleFullScreen();
      else if (e.key === "Escape") {
        document.getElementById("overviewModal").style.display = "none";
      }
    });

    document.addEventListener("DOMContentLoaded", renderDeck);
  </script>
