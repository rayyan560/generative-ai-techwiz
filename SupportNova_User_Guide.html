<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SupportNova – 30‑Slide User Guide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary:#6366f1;--primary-dark:#4f46e5;--secondary:#8b5cf6;--accent:#d946ef;--emerald:#10b981;--amber:#f59e0b;--rose:#f43f5e;--cyan:#06b6d4;--bg-gradient:linear-gradient(135deg,#0f172a 0%,#1e1b4b 35%,#180828 70%,#030712 100%);--glass-bg:rgba(255,255,255,0.06);--glass-bg-card:rgba(255,255,255,0.08);--glass-border:rgba(255,255,255,0.15);--glass-border-subtle:rgba(255,255,255,0.08);--text-heading:#fff;--text-body:#e2e8f0;--text-muted:#94a3b8;--radius:20px;}
    *{box-sizing:border-box;margin:0;padding:0;font-family:'Outfit',sans-serif;}
    body{background:var(--bg-gradient);color:var(--text-body);min-height:100vh;display:flex;flex-direction:column;overflow:hidden;}
    .deck-header{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;background:rgba(15,23,42,0.65);backdrop-filter:blur(20px);border-bottom:1px solid var(--glass-border-subtle);}
    .deck-logo{display:flex;align-items:center;gap:12px;font-weight:800;font-size:1.15rem;color:#fff;letter-spacing:-0.5px;}
    .deck-logo i{color:#818cf8;font-size:1.4rem;}
    .deck-title-center{font-size:0.9rem;font-weight:600;color:var(--text-muted);}    
    .deck-controls{display:flex;gap:12px;}
    .btn-nav{background:var(--glass-bg);border:1px solid var(--glass-border);color:#fff;padding:7px 16px;border-radius:12px;cursor:pointer;font-size:0.85rem;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:all 0.2s ease;}
    .btn-nav:hover{background:rgba(99,102,241,0.3);border-color:#818cf8;transform:translateY(-1px);}    
    .deck-stage{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:24px;}
    .slide-wrapper{width:100%;max-width:1300px;height:calc(100vh-160px);max-height:840px;display:none;opacity:0;transform:scale(0.96);transition:all 0.4s cubic-bezier(0.16,1,0.3,1);}
    .slide-wrapper.active{display:flex;opacity:1;transform:scale(1);}
    .slide-card{width:100%;height:100%;background:var(--glass-bg-card);backdrop-filter:blur(36px) saturate(190%);border:1px solid var(--glass-border);border-radius:var(--radius);padding:44px 56px;display:flex;flex-direction:column;box-shadow:0 30px 60px rgba(0,0,0,0.45),inset 0 1px 0 rgba(255,255,255,0.2);overflow-y:auto;position:relative;}
    .slide-tag{display:inline-flex;align-items:center;gap:8px;padding:4px 14px;border-radius:999px;background:rgba(99,102,241,0.2);border:1px solid rgba(99,102,241,0.4);color:#a5b4fc;font-size:0.78rem;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:14px;width:fit-content;}
    .slide-heading{font-size:2.2rem;font-weight:800;color:#fff;margin-bottom:12px;line-height:1.2;background:linear-gradient(135deg,#ffffff 0%,#cbd5e1 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
    .slide-desc{font-size:1.05rem;color:var(--text-muted);line-height:1.6;margin-bottom:28px;max-width:950px;}
    .slide-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:24px;flex:1;}
    .slide-grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;flex:1;}
    .feature-box{background:rgba(255,255,255,0.04);border:1px solid var(--glass-border-subtle);border-radius:16px;padding:22px 24px;display:flex;flex-direction:column;justify-content:flex-start;transition:transform 0.2s ease,border-color 0.2s ease;}
    .feature-box:hover{border-color:rgba(99,102,241,0.5);transform:translateY(-2px);background:rgba(255,255,255,0.06);}
    .feature-box-icon{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.2rem;margin-bottom:14px;}
    .feature-box-title{font-size:1.1rem;font-weight:700;color:#fff;margin-bottom:8px;}
    .feature-box-desc{font-size:0.9rem;color:var(--text-muted);line-height:1.5;}
    .deck-footer{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;background:rgba(15,23,42,0.7);backdrop-filter:blur(20px);border-top:1px solid var(--glass-border-subtle);}
    .progress-track{flex:1;max-width:500px;height:6px;background:rgba(255,255,255,0.1);border-radius:999px;overflow:hidden;margin:0 24px;}
    .progress-fill{height:100%;background:linear-gradient(90deg,#6366f1,#8b5cf6,#d946ef);width:2%;transition:width 0.3s ease;}
    .slide-counter{font-family:'JetBrains Mono',monospace;font-size:0.88rem;font-weight:700;color:#fff;min-width:100px;}
    .overview-modal{position:fixed;inset:0;background:rgba(10,15,30,0.85);backdrop-filter:blur(24px);z-index:200;display:none;flex-direction:column;padding:40px;}
    .overview-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;overflow-y:auto;flex:1;margin-top:20px;}
    .overview-item{background:rgba(255,255,255,0.05);border:1px solid var(--glass-border);border-radius:12px;padding:14px;cursor:pointer;transition:all 0.2s ease;}
    .overview-item:hover{background:rgba(99,102,241,0.25);border-color:#818cf8;transform:scale(1.02);}    
  </style>
</head>
<body>
  <header class="deck-header">
    <div class="deck-logo"><i class="fa-solid fa-layer-group"></i><span>SupportNova <span style="color:#818cf8;">User Guide</span></span></div>
    <div class="deck-title-center" id="deckSectionTitle">Introduction</div>
    <div class="deck-controls">
      <button class="btn-nav" onclick="toggleOverview()"><i class="fa-solid fa-table-cells-large"></i> Grid [O]</button>
      <button class="btn-nav" onclick="toggleFullScreen()"><i class="fa-solid fa-expand"></i> Fullscreen [F]</button>
    </div>
  </header>

  <main class="deck-stage" id="slideStage"></main>

  <footer class="deck-footer">
    <div style="display:flex;gap:8px;">
      <button class="btn-nav" onclick="prevSlide()"><i class="fa-solid fa-arrow-left"></i> Prev</button>
      <button class="btn-nav" onclick="nextSlide()">Next <i class="fa-solid fa-arrow-right"></i></button>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="slide-counter" id="slideCounter">Slide 1 / 30</div>
  </footer>

  <div class="overview-modal" id="overviewModal">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <h2 style="font-size:1.4rem;color:#fff;font-weight:800;">30‑Slide Table of Contents</h2>
      <button class="btn-nav" onclick="toggleOverview()">&times; Close</button>
    </div>
    <div class="overview-grid" id="overviewGrid"></div>
  </div>

  <script>
    const slidesData = [
      // 1‑5: Getting Started
      {section:"1. Getting Started",tag:"Slide 01 • Welcome",title:"Welcome to SupportNova",desc:"An intuitive, glass‑morphic UI that empowers customers and agents alike.",grid:"2",items:[{icon:"fa-user",title:"User Personas",desc:"Support agents, supervisors, and end‑customers."},{icon:"fa-mobile-screen",title:"Device Support",desc:"Responsive across desktop, tablet and mobile."}]},
      {section:"1. Getting Started",tag:"Slide 02 • Sign In",title:"Sign In with Your Account",desc:"Use the username and password provided by the project administrator.",grid:"2",items:[{icon:"fa-key",title:"Username & Password",desc:"Standard SupportNova account authentication."},{icon:"fa-user-shield",title:"Role-Based Access",desc:"Your assigned role determines which staff pages are available."}]},
      {section:"1. Getting Started",tag:"Slide 03 • Dashboard Overview",title:"Review Current Support Work",desc:"Dashboard cards and tables summarize the complaint and workload data available to your account.",grid:"2",items:[{icon:"fa-tachometer-alt",title:"Workload Summary",desc:"Review current cases and their recorded statuses."},{icon:"fa-chart-line",title:"Analytics",desc:"Charts use the data currently stored by the application."}]},
      {section:"1. Getting Started",tag:"Slide 04 • Navigation",title:"Intuitive Navigation",desc:"Command palette (⌘K) and side‑menu for fast access.",grid:"2",items:[{icon:"fa-search",title:"Palette",desc:"Fuzzy search across tickets, policies, actions."},{icon:"fa-bars",title:"Side‑Menu",desc:"Responsive collapsible menu."}]},
      {section:"1. Getting Started",tag:"Slide 05 • Display Preferences",title:"Theme and Keyboard Basics",desc:"Use the theme control to switch between the available light and dark palettes; keyboard and screen-reader coverage is not certified.",grid:"2",items:[{icon:"fa-keyboard",title:"Keyboard Navigation",desc:"Use browser and page controls where available; not every action has been accessibility-audited."},{icon:"fa-eye",title:"Light / Dark Theme",desc:"The selected theme changes the interface palette."}]},
      // 6‑10: Core Interactions
      {section:"2. Core Interactions",tag:"Slide 06 • Ticket Creation",title:"Create a New Ticket",desc:"Step‑by‑step guided form with micro‑animations.",grid:"2",items:[{icon:"fa-plus-circle",title:"Guided Form",desc:"Smart defaults and inline validation."},{icon:"fa-microphone",title:"Voice Capture",desc:"Dictate issue via microphone."}]},
      {section:"2. Core Interactions",tag:"Slide 07 • Ticket View",title:"Ticket Detail View",desc:"Glass panel with timeline, attachments, and AI suggestions.",grid:"2",items:[{icon:"fa-clock",title:"Timeline",desc:"Chronological event log."},{icon:"fa-lightbulb",title:"AI Suggestions",desc:"Suggested resolutions & next steps."}]},
      {section:"2. Core Interactions",tag:"Slide 08 • Real‑Time Chat",title:"Live Agent Chat",desc:"WebSocket powered chat with typing indicators.",grid:"2",items:[{icon:"fa-comment-dots",title:"Typing Indicator",desc:"Shows when agent is typing."},{icon:"fa-wifi",title:"Live Sync",desc:"Instant message propagation."}]},
      {section:"2. Core Interactions",tag:"Slide 09 • Text Sentiment",title:"Text-Based Sentiment Estimate",desc:"Complaint wording can be used to estimate a text sentiment signal; it is not an audio or clinical assessment.",grid:"2",items:[{icon:"fa-fire",title:"Text Signal",desc:"A heuristic/model result is an estimate, not a guaranteed emotion score."},{icon:"fa-message",title:"Case Context",desc:"Staff should review the customer's actual complaint."}]},
      {section:"2. Core Interactions",tag:"Slide 10 • Escalation Review",title:"Policy-Based Escalation",desc:"Configured safety, legal, privacy, and operational triggers can flag cases for staff review.",grid:"2",items:[{icon:"fa-level-up-alt",title:"Named Triggers",desc:"Escalation conditions are evaluated from complaint information."},{icon:"fa-user-tie",title:"Staff Decision",desc:"The app does not provide a live video handoff."}]},
      // 11‑15: AI Features
      {section:"3. AI Features",tag:"Slide 11 • Image Evidence",title:"Image Evidence Review",desc:"When configured, an image-analysis provider can assist with customer-submitted complaint photos; staff must verify its output.",grid:"2",items:[{icon:"fa-camera",title:"Photo Analysis",desc:"AI output is advisory and depends on provider availability."},{icon:"fa-shield-halved",title:"Safety Review",desc:"Potential hazards are escalated for human review; no fraud score is certified."}]},
      {section:"3. AI Features",tag:"Slide 12 • Text and Dictation",title:"Text-Based Assistance",desc:"The app can analyze written complaints and may offer browser speech-to-text input where supported; it does not analyze call audio.",grid:"2",items:[{icon:"fa-microphone",title:"Optional Dictation",desc:"Browser and microphone permissions are required where available."},{icon:"fa-message",title:"Text Analysis",desc:"Sentiment and language signals are derived from text, not pitch or tempo."}]},
      {section:"3. AI Features",tag:"Slide 13 • Refund Review",title:"Refund Decision Support",desc:"The application records review decisions and policy guidance; it does not hold funds or execute payments.",grid:"2",items:[{icon:"fa-money-bill-transfer",title:"Eligibility Review",desc:"Check case facts and applicable policy before deciding."},{icon:"fa-file-invoice-dollar",title:"Decision Record",desc:"Recorded actions support later staff review."}]},
      {section:"3. AI Features",tag:"Slide 14 • Policy Auditor",title:"Policy Validity and Traceability Audit",desc:"The current auditor checks document metadata, expiry dates, and policy IDs referenced by rules; it does not detect semantic contradictions.",grid:"2",items:[{icon:"fa-file-circle-check",title:"Metadata Findings",desc:"Flags active documents with expired dates."},{icon:"fa-scale-balanced",title:"Rule References",desc:"Finds policy references without a currently valid active source."}]},
      {section:"3. AI Features",tag:"Slide 15 • Complaint Analytics",title:"Complaint Category Trends",desc:"Analytics summarize records available in the database; they are not a product reliability certification.",grid:"2",items:[{icon:"fa-laptop",title:"Case Categories",desc:"Review recorded complaint and defect categories."},{icon:"fa-chart-pie",title:"Trend Charts",desc:"Interpret counts in the context of the current dataset."}]},
      // 16‑20: Administration
      {section:"4. Administration",tag:"Slide 16 • Role Management",title:"Role-Based Access",desc:"Administrators manage supported user roles; available actions depend on the role and route permissions.",grid:"2",items:[{icon:"fa-user-lock",title:"Supported Staff Roles",desc:"Admin, agent, warranty manager, and read-only judge access."},{icon:"fa-key",title:"Permission Checks",desc:"The app enforces access rules; it does not assign SOPs individually to users."}]},
      {section:"4. Administration",tag:"Slide 17 • Theme Switching",title:"Light / Dark Glassmorphism",desc:"Toggle theme – preserves glass effect.",grid:"2",items:[{icon:"fa-sun",title:"Light Mode",desc:"Bright glass panels."},{icon:"fa-moon",title:"Dark Mode",desc:"Deep‑sea glass."}]},
      {section:"4. Administration",tag:"Slide 18 • Notifications",title:"In-App Notifications",desc:"Use the visible toast notifications to understand whether an action succeeded or failed.",grid:"2",items:[{icon:"fa-bell-concierge",title:"Status Feedback",desc:"Notifications describe the result of supported actions."},{icon:"fa-volume-high",title:"Sound Preference",desc:"Sound cues may be controlled by the interface settings where available."}]},
      {section:"4. Administration",tag:"Slide 19 • Data Export",title:"Available Data Exports",desc:"Use exports exposed by the relevant dashboard; not every report is available in every format.",grid:"2",items:[{icon:"fa-file-csv",title:"CSV Export",desc:"Download supported complaint or analytics tables."},{icon:"fa-file-pdf",title:"PDF Reports",desc:"PDF export is not available across all dashboards."}]},
      {section:"4. Administration",tag:"Slide 20 • Service Health",title:"Application Health Check",desc:"The public health endpoint reports whether the application process is responding; it is not a full monitoring dashboard.",grid:"2",items:[{icon:"fa-heart-pulse",title:"Health Endpoint",desc:"Use /health for a basic service response check."},{icon:"fa-gear",title:"Operational Monitoring",desc:"Database and provider health need separate verification."}]},
      // 21‑25: Advanced Usage
      {section:"5. Advanced Usage",tag:"Slide 21 • Command Palette",title:"Search and Navigate",desc:"Use the available keyboard shortcut to open the command palette and find supported pages or records.",grid:"2",items:[{icon:"fa-terminal",title:"Quick Search",desc:"Search results depend on the indexed information available."},{icon:"fa-magic",title:"Navigation",desc:"The palette does not record macros or replay arbitrary actions."}]},
      {section:"5. Advanced Usage",tag:"Slide 22 • Evidence Attachments",title:"Attach Complaint Evidence",desc:"Attach supported evidence to a complaint and provide enough context for staff to review it.",grid:"2",items:[{icon:"fa-paperclip",title:"Supported Files",desc:"Accepted file types and size limits are shown by the upload control."},{icon:"fa-user-shield",title:"Sensitive Data",desc:"Only submit information relevant to resolving the complaint."}]},
      {section:"5. Advanced Usage",tag:"Slide 23 • API Reference",title:"Application API",desc:"FastAPI exposes application endpoints for its own web client; third-party webhooks and CRM integrations are not included.",grid:"2",items:[{icon:"fa-code",title:"FastAPI Routes",desc:"Routes are documented by the application where API docs are enabled."},{icon:"fa-plug",title:"External Integrations",desc:"Configure and validate any external integration separately."}]},
      {section:"5. Advanced Usage",tag:"Slide 24 • Theme",title:"Available Theme Options",desc:"Choose from the existing light and dark themes; a live brand editor is not provided.",grid:"2",items:[{icon:"fa-paint-brush",title:"Current Palettes",desc:"Existing CSS tokens style the interface."},{icon:"fa-sliders",title:"Theme Selection",desc:"The theme toggle changes the available palette."}]},
      {section:"5. Advanced Usage",tag:"Slide 25 • Current Scope",title:"Configured Features and Roadmap",desc:"Use only features visible in the deployed application. Proposed modules are not active unless specifically implemented and enabled.",grid:"2",items:[{icon:"fa-list-check",title:"Available Now",desc:"Complaint intake, staff review, policy checks, and supported analytics."},{icon:"fa-rocket",title:"Future Work",desc:"Voice analytics, macro playback, and experimental modules are roadmap ideas."}]},
      // 26‑30: Closing & Resources
      {section:"6. Closing",tag:"Slide 26 • Support Resources",title:"Project Documentation",desc:"Use the repository's project guides and the Knowledge Base page to understand the system and its policies.",grid:"2",items:[{icon:"fa-book",title:"Guides",desc:"Consult the user and developer documentation included with the project."},{icon:"fa-headset",title:"Support",desc:"Contact the project administrator for account or deployment support."}]},
      {section:"6. Closing",tag:"Slide 27 • Demonstration Videos",title:"Project Walkthrough Videos",desc:"Use the provided demonstration videos for orientation; they are not interactive training sessions.",grid:"2",items:[{icon:"fa-video",title:"Recorded Demos",desc:"Video coverage depends on the included recording."},{icon:"fa-chalkboard-teacher",title:"Live Sessions",desc:"Scheduled webinars are not part of the application."}]},
      {section:"6. Closing",tag:"Slide 28 • Feedback",title:"Project Feedback",desc:"Report issues or improvement ideas to the project owner; a public community forum is not provided.",grid:"2",items:[{icon:"fa-users",title:"Project Contact",desc:"Use the contact channel shared by your administrator."},{icon:"fa-lightbulb",title:"Future Improvements",desc:"Suggestions can be evaluated for future releases."}]},
      {section:"6. Closing",tag:"Slide 29 • Roadmap",title:"Future Features",desc:"AR diagnostics, deeper analytics, multilingual expansion.",grid:"2",items:[{icon:"fa-road",title:"Planned",desc:"Quarterly releases."},{icon:"fa-rocket",title:"Innovation",desc:"Stay ahead."}]},
      {section:"6. Closing",tag:"Slide 30 • Thank You",title:"Thank You for Choosing SupportNova",desc:"Empowering support with AI & transparency.",grid:"2",items:[{icon:"fa-heart",title:"Your Success",desc:"Our mission."},{icon:"fa-star",title:"Stay Connected",desc:"Follow us for updates."}]}
    ];
    let currentSlide=0;
    const stage=document.getElementById('slideStage');
    const overviewGrid=document.getElementById('overviewGrid');
    function renderDeck(){
      stage.innerHTML='';overviewGrid.innerHTML='';
      slidesData.forEach((s,idx)=>{
        const slide=document.createElement('div');
        slide.className=`slide-wrapper ${idx===0?'active':''}`;slide.id=`slide-${idx}`;
        const gridClass=s.grid==='3'?'slide-grid-3':'slide-grid-2';
        const itemsHtml=s.items.map(item=>`<div class="feature-box"><div class="feature-box-icon"><i class="fa-solid ${item.icon}"></i></div><div class="feature-box-title">${item.title}</div><div class="feature-box-desc">${item.desc}</div></div>`).join('');
        slide.innerHTML=`<div class="slide-card"><div class="slide-tag"><i class="fa-solid fa-sparkles"></i> ${s.tag}</div><h1 class="slide-heading">${s.title}</h1><p class="slide-desc">${s.desc}</p><div class="${gridClass}">${itemsHtml}</div></div>`;
        stage.appendChild(slide);
        const over=document.createElement('div');
        over.className=`overview-item ${idx===0?'active':''}`;over.id=`over-${idx}`;over.onclick=()=>goToSlide(idx);
        over.innerHTML=`<div style="font-size:0.75rem;color:#818cf8;font-weight:700;">#${idx+1}</div><div style="font-size:0.85rem;font-weight:700;color:#fff;margin-top:2px;">${s.title.substring(0,42)}...</div>`;
        overviewGrid.appendChild(over);
      });
      updateUI();
    }
    function updateUI(){
      document.querySelectorAll('.slide-wrapper').forEach((el,i)=>el.classList.toggle('active',i===currentSlide));
      document.querySelectorAll('.overview-item').forEach((el,i)=>el.classList.toggle('active',i===currentSlide));
      document.getElementById('slideCounter').innerText=`Slide ${currentSlide+1} / ${slidesData.length}`;
      document.getElementById('deckSectionTitle').innerText=slidesData[currentSlide].section;
      const pct=((currentSlide+1)/slidesData.length)*100;document.getElementById('progressFill').style.width=`${pct}%`;
    }
    function nextSlide(){if(currentSlide<slidesData.length-1){currentSlide++;updateUI();}}
    function prevSlide(){if(currentSlide>0){currentSlide--;updateUI();}}
    function goToSlide(idx){currentSlide=idx;updateUI();toggleOverview();}
    function toggleOverview(){const m=document.getElementById('overviewModal');m.style.display=m.style.display==='flex'?'none':'flex';}
    function toggleFullScreen(){if(!document.fullscreenElement){document.documentElement.requestFullscreen();}else{document.exitFullscreen && document.exitFullscreen();}}
    window.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown')nextSlide();else if(e.key==='ArrowLeft'||e.key==='PageUp')prevSlide();else if(e.key.toLowerCase()==='o')toggleOverview();else if(e.key.toLowerCase()==='f')toggleFullScreen();else if(e.key==='Escape'){document.getElementById('overviewModal').style.display='none';}});
    document.addEventListener('DOMContentLoaded',renderDeck);
  </script>
</body>
</html>
