<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SupportNova – 30‑Slide Developer Guide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {--primary:#6366f1;--primary-dark:#4f46e5;--secondary:#8b5cf6;--accent:#d946ef;--emerald:#10b981;--amber:#f59e0b;--rose:#f43f5e;--cyan:#06b6d4;--bg-gradient:linear-gradient(135deg,#0f172a 0%,#1e1b4b 35%,#180828 70%,#030712 100%);--glass-bg:rgba(255,255,255,0.06);--glass-bg-card:rgba(255,255,255,0.08);--glass-border:rgba(255,255,255,0.15);--glass-border-subtle:rgba(255,255,255,0.08);--text-heading:#fff;--text-body:#e2e8f0;--text-muted:#94a3b8;--radius:20px;}
    *{box-sizing:border-box;margin:0;padding:0;font-family:'Outfit',sans-serif;}
    body{background:var(--bg-gradient);color:var(--text-body);min-height:100vh;display:flex;flex-direction:column;overflow:hidden;}
    .deck-header{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;background:rgba(15,23,42,0.65);backdrop-filter:blur(20px);border-bottom:1px solid var(--glass-border-subtle);}
    .deck-logo{display:flex;align-items:center;gap:12px;font-weight:800;font-size:1.15rem;color:#fff;letter-spacing:-0.5px;}
    .deck-logo i{color:#818cf8;font-size:1.4rem;}
    .deck-title-center{font-size:0.9rem;font-weight:600;color:var(--text-muted);}    
    .deck-controls{display:flex;gap:12px;}
    .btn-nav{background:var(--glass-bg);border:1px solid var(--glass-border);color:#fff;padding:7px 16px;border-radius:12px;cursor:pointer;font-size:0.85rem;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:all 0.2s ease;}
    .btn-nav:hover{background:rgba(99,102,241,0.3);border-color:#818cf8;transform:translateY(-1px);}    
    .deck-stage{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:24px;}
    .slide-wrapper{width:100%;max-width:1300px;height:calc(100vh-160px);max-height:840px;display:none;opacity:0;transform:scale(0.96);transition:all 0.4s cubic-bezier(0.16,1,0.3,1);}
    .slide-wrapper.active{display:flex;opacity:1;transform:scale(1);}
    .slide-card{width:100%;height:100%;background:var(--glass-bg-card);backdrop-filter:blur(36px) saturate(190%);border:1px solid var(--glass-border);border-radius:var(--radius);padding:44px 56px;display:flex;flex-direction:column;box-shadow:0 30px 60px rgba(0,0,0,0.45),inset 0 1px 0 rgba(255,255,255,0.2);overflow-y:auto;position:relative;}
    .slide-tag{display:inline-flex;align-items:center;gap:8px;padding:4px 14px;border-radius:999px;background:rgba(99,102,241,0.2);border:1px solid rgba(99,102,241,0.4);color:#a5b4fc;font-size:0.78rem;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:14px;width:fit-content;}
    .slide-heading{font-size:2.2rem;font-weight:800;color:#fff;margin-bottom:12px;line-height:1.2;background:linear-gradient(135deg,#ffffff 0%,#cbd5e1 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
    .slide-desc{font-size:1.05rem;color:var(--text-muted);line-height:1.6;margin-bottom:28px;max-width:950px;}
    .slide-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:24px;flex:1;}
    .slide-grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;flex:1;}
    .feature-box{background:rgba(255,255,255,0.04);border:1px solid var(--glass-border-subtle);border-radius:16px;padding:22px 24px;display:flex;flex-direction:column;justify-content:flex-start;transition:transform 0.2s ease,border-color 0.2s ease;}
    .feature-box:hover{border-color:rgba(99,102,241,0.5);transform:translateY(-2px);background:rgba(255,255,255,0.06);}
    .feature-box-icon{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.2rem;margin-bottom:14px;}
    .feature-box-title{font-size:1.1rem;font-weight:700;color:#fff;margin-bottom:8px;}
    .feature-box-desc{font-size:0.9rem;color:var(--text-muted);line-height:1.5;}
    .deck-footer{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;background:rgba(15,23,42,0.7);backdrop-filter:blur(20px);border-top:1px solid var(--glass-border-subtle);}
    .progress-track{flex:1;max-width:500px;height:6px;background:rgba(255,255,255,0.1);border-radius:999px;overflow:hidden;margin:0 24px;}
    .progress-fill{height:100%;background:linear-gradient(90deg,#6366f1,#8b5cf6,#d946ef);width:2%;transition:width 0.3s ease;}
    .slide-counter{font-family:'JetBrains Mono',monospace;font-size:0.88rem;font-weight:700;color:#fff;min-width:100px;}
    .overview-modal{position:fixed;inset:0;background:rgba(10,15,30,0.85);backdrop-filter:blur(24px);z-index:200;display:none;flex-direction:column;padding:40px;}
    .overview-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;overflow-y:auto;flex:1;margin-top:20px;}
    .overview-item{background:rgba(255,255,255,0.05);border:1px solid var(--glass-border);border-radius:12px;padding:14px;cursor:pointer;transition:all 0.2s ease;}
    .overview-item:hover{background:rgba(99,102,241,0.25);border-color:#818cf8;transform:scale(1.02);}    
  </style>
</head>
<body>
  <header class="deck-header">
    <div class="deck-logo"><i class="fa-solid fa-layer-group"></i><span>SupportNova <span style="color:#818cf8;">Developer Guide</span></span></div>
    <div class="deck-title-center" id="deckSectionTitle">Setup & Architecture</div>
    <div class="deck-controls">
      <button class="btn-nav" onclick="toggleOverview()"><i class="fa-solid fa-table-cells-large"></i> Grid [O]</button>
      <button class="btn-nav" onclick="toggleFullScreen()"><i class="fa-solid fa-expand"></i> Fullscreen [F]</button>
    </div>
  </header>
  <main class="deck-stage" id="slideStage"></main>
  <footer class="deck-footer">
    <div style="display:flex;gap:8px;">
      <button class="btn-nav" onclick="prevSlide()"><i class="fa-solid fa-arrow-left"></i> Prev</button>
      <button class="btn-nav" onclick="nextSlide()">Next <i class="fa-solid fa-arrow-right"></i></button>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="slide-counter" id="slideCounter">Slide 1 / 30</div>
  </footer>
  <div class="overview-modal" id="overviewModal">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <h2 style="font-size:1.4rem;color:#fff;font-weight:800;">30‑Slide Table of Contents</h2>
      <button class="btn-nav" onclick="toggleOverview()">&times; Close</button>
    </div>
    <div class="overview-grid" id="overviewGrid"></div>
  </div>
  <script>
    const slidesData = [
      // 1‑5: Project Overview & Stack
      {section:"1. Project Overview",tag:"Slide 01 • Vision",title:"SupportNova Architecture",desc:"Dual‑pipeline deterministic + generative AI engine.",grid:"2",items:[{icon:"fa-brain",title:"GenAI Pipeline",desc:"LLM for empathy & triage."},{icon:"fa-code-compare",title:"Ground‑Truth Pipeline",desc:"Rule‑based verification engine."}]},
      {section:"1. Project Overview",tag:"Slide 02 • Tech Stack",title:"Technology Stack",desc:"FastAPI, Uvicorn, vanilla JS, WebSockets, PostgreSQL JSONB.",grid:"2",items:[{icon:"fa-python",title:"Backend",desc:"Async FastAPI services."},{icon:"fa-js",title:"Frontend",desc:"Plain JS with glass UI components."}]},
      {section:"1. Project Overview",tag:"Slide 03 • Repo Layout",title:"Folder Structure",desc:"Clear separation of src, static, templates, tests.",grid:"2",items:[{icon:"fa-folder-open",title:"src",desc:"Python packages – vision, knowledge, analytics."},{icon:"fa-folder",title:"static",desc:"JS, CSS, images – glassmorphic assets."}]},
      {section:"1. Project Overview",tag:"Slide 04 • CI/CD",title:"Automated Deployments",desc:"GitHub Actions build Docker image, run tests, push to registry.",grid:"2",items:[{icon:"fa-github",title:"GitHub Actions",desc:"Lint, test, build."},{icon:"fa-docker",title:"Docker",desc:"Multi‑stage image, health‑checks."}]},
      {section:"1. Project Overview",tag:"Slide 05 • Dev Workflow",title:"Local Development",desc:"venv, uvicorn --reload, hot‑module reloading.",grid:"2",items:[{icon:"fa-terminal",title:"Commands",desc:"pip install -r requirements.txt"},{icon:"fa-bolt",title:"Live Reload",desc:"Hot‑reload on code change."}]},
      // 6‑10: Backend Modules
      {section:"2. Backend Modules",tag:"Slide 06 • API Router",title:"FastAPI Router Design",desc:"Modular routers for auth, tickets, analytics.",grid:"2",items:[{icon:"fa-route",title:"Router Files",desc:"src/api/auth.py, tickets.py, analytics.py"},{icon:"fa-plug",title:"DI",desc:"Pydantic models, DB session middleware."}]},
      {section:"2. Backend Modules",tag:"Slide 07 • Vision Service",title:"Multimodal Vision Service",desc:"Gemini Vision integration, defect detection pipeline.",grid:"2",items:[{icon:"fa-camera",title:"Model",desc:"TensorFlow inference."},{icon:"fa-wrench",title:"Service Layer",desc:"src/vision/engine.py abstracts model calls."}]},
      {section:"2. Backend Modules",tag:"Slide 08 • Policy Auditor",title:"RAG Policy Auditor",desc:"PyMuPDF ingestion, chunking, vector store, drift detection.",grid:"2",items:[{icon:"fa-file-pdf",title:"Ingestion",desc:"src/knowledge/ingest.py"},{icon:"fa-magnifying-glass-chart",title:"Auditor",desc:"src/knowledge/auditor.py runs scheduled scans."}]},
      {section:"2. Backend Modules",tag:"Slide 09 • Escrow Engine",title:"Financial Smart Escrow",desc:"CLV optimizer algorithm, ledger persistence.",grid:"2",items:[{icon:"fa-money-bill-transfer",title:"Optimizer",desc:"src/finance/optimizer.py uses linear programming."},{icon:"fa-file-invoice-dollar",title:"Ledger",desc:"Transaction logs stored in PostgreSQL JSONB."}]},
      {section:"2. Backend Modules",tag:"Slide 10 • WebSocket",title:"Triaging WebSocket",desc:"Bi‑directional updates for agents and supervisors.",grid:"2",items:[{icon:"fa-wifi",title:"Endpoint",desc:"/ws/triage with fastapi-websocket‑rpc."},{icon:"fa-sync",title:"Broadcast",desc:"Redis pub/sub for scaling across workers."}]},
      // 11‑15: Frontend Architecture
      {section:"3. Frontend Architecture",tag:"Slide 11 • UI Components",title:"Glassmorphic Component Library",desc:"Reusable CSS, micro‑interactions, tilt physics.",grid:"2",items:[{icon:"fa-cube",title:"Components",desc:"Cards, modals, toast stack, command palette."},{icon:"fa-wand-magic-sparkles",title:"Animations",desc:"CSS transitions, keyframes, requestAnimationFrame."}]},
      {section:"3. Frontend Architecture",tag:"Slide 12 • State Management",title:"Global Store Pattern",desc:"Singleton store holds user, tickets, UI flags.",grid:"2",items:[{icon:"fa-database",title:"Store",desc:"src/static/js/store.js with ES6 Proxy for reactivity."},{icon:"fa-sync",title:"Events",desc:"Custom event bus for component communication."}]},
      {section:"3. Frontend Architecture",tag:"Slide 13 • Command Palette",title:"Universal Palette (⌘K)",desc:"Fuzzy search across tickets, policies, actions.",grid:"2",items:[{icon:"fa-terminal",title:"Implementation",desc:"src/static/js/palette.js uses Fuse.js."},{icon:"fa-magic",title:"Actions",desc:"Trigger navigation, API calls, UI toggles."}]},
      {section:"3. Frontend Architecture",tag:"Slide 14 • Live Chat UI",title:"Live Chat Component",desc:"WebSocket integration with typing indicator.",grid:"2",items:[{icon:"fa-comment-dots",title:"Component",desc:"src/static/js/chat.js renders messages."},{icon:"fa-wifi",title:"Socket Layer",desc:"src/static/js/socket.js abstracts WS handling."}]},
      {section:"3. Frontend Architecture",tag:"Slide 15 • Accessibility",title:"Keyboard First & ARIA",desc:"All interactive elements expose proper ARIA roles.",grid:"2",items:[{icon:"fa-keyboard",title:"Shortcuts",desc:"Prev/Next, palette, overview modal."},{icon:"fa-universal-access",title:"Screen Readers",desc:"Live region announcements for dynamic updates."}]},
      // 16‑20: Testing & QA
      {section:"4. Testing",tag:"Slide 16 • Unit Tests",title:"Pytest Suite",desc:"> 90% coverage across vision, finance, auditor.",grid:"2",items:[{icon:"fa-vial",title:"Structure",desc:"tests/unit/* for pure functions."},{icon:"fa-check-double",title:"Coverage",desc:"coverage.py reports in CI."}]},
      {section:"4. Testing",tag:"Slide 17 • Integration Tests",title:"Full Stack Scenarios",desc:"Spin up test server, hit API endpoints, verify WS flow.",grid:"2",items:[{icon:"fa-plug",title:"Testcontainers",desc:"Dockerized Postgres for DB integration."},{icon:"fa-sync",title:"WebSocket Tests",desc:"asyncio client simulating agent sessions."}]},
      {section:"4. Testing",tag:"Slide 18 • Linting",title:"Flake8, Black, Prettier",desc:"Enforced via pre‑commit hooks.",grid:"2",items:[{icon:"fa-code",title:"Python Lint",desc:"flake8 + mypy static typing."},{icon:"fa-brackets-curly",title:"JS Formatting",desc:"Prettier with .prettierrc."}]},
      {section:"4. Testing",tag:"Slide 19 • Performance",title:"Load Testing",desc:"Locust scripts simulate 10k concurrent agents.",grid:"2",items:[{icon:"fa-bolt",title:"Metrics",desc:"Avg response < 120 ms, 99th percentile < 250 ms."},{icon:"fa-chart-line",title:"Results",desc:"CPU < 70%, memory < 1 GB on single instance."}]},
      {section:"4. Testing",tag:"Slide 20 • Security",title:"Static & Dynamic Scan",desc:"Bandit, OWASP ZAP scan for vulnerabilities.",grid:"2",items:[{icon:"fa-shield-halved",title:"Static",desc:"Bandit reports no high issues."},{icon:"fa-bug",title:"Dynamic",desc:"ZAP identified low‑risk XSS, patched."}]},
      // 21‑25: Deployment & Ops
      {section:"5. Deployment",tag:"Slide 21 • Docker",title:"Multi‑Stage Dockerfile",desc:"Build stage for deps, runtime stage with Uvicorn.",grid:"2",items:[{icon:"fa-docker",title:"Build",desc:"python:3.12‑slim as builder."},{icon:"fa-server",title:"Runtime",desc:"uvicorn workers=4, healthcheck /health."}]},
      {section:"5. Deployment",tag:"Slide 22 • K8s",title:"Helm Chart",desc:"Deployments, Services, Ingress, ConfigMaps.",grid:"2",items:[{icon:"fa-cubes",title:"Chart",desc:"templates/deployment.yaml, service.yaml"},{icon:"fa-network-wired",title:"Ingress",desc:"TLS termination via cert‑manager."}]},
      {section:"5. Deployment",tag:"Slide 23 • CI/CD",title:"GitHub Actions Workflow",desc:"Build, test, push Docker, trigger Helm upgrade.",grid:"2",items:[{icon:"fa-gear",title:"Jobs",desc:"build, test, deploy stages."},{icon:"fa-rocket",title:"Auto‑Deploy",desc:"On merge to main branch."}]},
      {section:"5. Deployment",tag:"Slide 24 • Observability",title:"Prometheus & Grafana",desc:"Export /metrics endpoint, dashboards for SLA.",grid:"2",items:[{icon:"fa-chart-area",title:"Metrics",desc:"Uvicorn request latency, error rate."},{icon:"fa-eye",title:"Dashboards",desc:"Ticket volume, sentiment heatmap visualized."}]},
      {section:"5. Deployment",tag:"Slide 25 • Scaling",title:"Horizontal Autoscaling",desc:"K8s HPA based on CPU & request latency.",grid:"2",items:[{icon:"fa-arrow-up",title:"Scale‑up",desc:"Add pods when avg CPU > 70%."},{icon:"fa-arrow-down",title:"Scale‑down",desc:"Remove pods during off‑peak."}]},
      // 26‑30: Advanced Topics & Roadmap
      {section:"6. Advanced Topics",tag:"Slide 26 • Multilingual",title:"Polyglot LLM Pipelines",desc:"Language detection, translation layer before GenAI.",grid:"2",items:[{icon:"fa-language",title:"Detection",desc:"FastText language ID."},{icon:"fa-globe",title:"Translation",desc:"Google Translate API fallback."}]},
      {section:"6. Advanced Topics",tag:"Slide 27 • AR UI",title:"Future WebXR Extension",desc:"Overlay 3D repair instructions on live camera feed.",grid:"2",items:[{icon:"fa-vr-cardboard",title:"WebXR",desc:"Three.js based AR scene."},{icon:"fa-wrench",title:"Use‑case",desc:"Guided hardware repair steps."}]},
      {section:"6. Advanced Topics",tag:"Slide 28 • Model Drift",title:"Continuous Learning Loop",desc:"Collect human‑validated outcomes, fine‑tune LLM.",grid:"2",items:[{icon:"fa-brain",title:"Feedback Store",desc:"User corrections stored in DB."},{icon:"fa-sync",title:"Retraining",desc:"Scheduled SageMaker jobs."}]},
      {section:"6. Advanced Topics",tag:"Slide 29 • Compliance",title:"GDPR & Data Retention",desc:"Automated purge of personal data after 30 days.",grid:"2",items:[{icon:"fa-user-shield",title:"Policy Engine",desc:"src/compliance/purge.py"},{icon:"fa-calendar",title:"Scheduler",desc:"Cron job via APScheduler."}]},
      {section:"6. Advanced Topics",tag:"Slide 30 • Thank You",title:"Join the Innovation Journey",desc:"Contribute, report issues, shape the future of autonomous support.",grid:"2",items:[{icon:"fa-heart",title:"Community",desc:"Open‑source on GitHub."},{icon:"fa-star",title:"Star Us",desc:"Help us grow!"}]}
    ];
    let currentSlide=0;
    const stage=document.getElementById('slideStage');
    const overviewGrid=document.getElementById('overviewGrid');
    function renderDeck(){
      stage.innerHTML='';overviewGrid.innerHTML='';
      slidesData.forEach((s,idx)=>{
        const slide=document.createElement('div');
        slide.className=`slide-wrapper ${idx===0?'active':''}`;slide.id=`slide-${idx}`;
        const gridClass=s.grid==='3'?'slide-grid-3':'slide-grid-2';
        const itemsHtml=s.items.map(item=>`<div class="feature-box"><div class="feature-box-icon"><i class="fa-solid ${item.icon}"></i></div><div class="feature-box-title">${item.title}</div><div class="feature-box-desc">${item.desc}</div></div>`).join('');
        slide.innerHTML=`<div class="slide-card"><div class="slide-tag"><i class="fa-solid fa-sparkles"></i> ${s.tag}</div><h1 class="slide-heading">${s.title}</h1><p class="slide-desc">${s.desc}</p><div class="${gridClass}">${itemsHtml}</div></div>`;
        stage.appendChild(slide);
        const over=document.createElement('div');
        over.className=`overview-item ${idx===0?'active':''}`;over.id=`over-${idx}`;over.onclick=()=>goToSlide(idx);
        over.innerHTML=`<div style="font-size:0.75rem;color:#818cf8;font-weight:700;">#${idx+1}</div><div style="font-size:0.85rem;font-weight:700;color:#fff;margin-top:2px;">${s.title.substring(0,42)}...</div>`;
        overviewGrid.appendChild(over);
      });
      updateUI();
    }
    function updateUI(){
      document.querySelectorAll('.slide-wrapper').forEach((el,i)=>el.classList.toggle('active',i===currentSlide));
      document.querySelectorAll('.overview-item').forEach((el,i)=>el.classList.toggle('active',i===currentSlide));
      document.getElementById('slideCounter').innerText=`Slide ${currentSlide+1} / ${slidesData.length}`;
      document.getElementById('deckSectionTitle').innerText=slidesData[currentSlide].section;
      const pct=((currentSlide+1)/slidesData.length)*100;document.getElementById('progressFill').style.width=`${pct}%`;
    }
    function nextSlide(){if(currentSlide<slidesData.length-1){currentSlide++;updateUI();}}
    function prevSlide(){if(currentSlide>0){currentSlide--;updateUI();}}
    function goToSlide(idx){currentSlide=idx;updateUI();toggleOverview();}
    function toggleOverview(){const m=document.getElementById('overviewModal');m.style.display=m.style.display==='flex'?'none':'flex';}
    function toggleFullScreen(){if(!document.fullscreenElement){document.documentElement.requestFullscreen();}else{document.exitFullscreen && document.exitFullscreen();}}
    window.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown')nextSlide();else if(e.key==='ArrowLeft'||e.key==='PageUp')prevSlide();else if(e.key.toLowerCase()=='o')toggleOverview();else if(e.key.toLowerCase()=='f')toggleFullScreen();else if(e.key==='Escape'){document.getElementById('overviewModal').style.display='none';}});
    document.addEventListener('DOMContentLoaded',renderDeck);
  </script>
</body>
</html>
